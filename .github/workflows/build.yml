# Builds logo3dprint for Linux, Windows and macOS and uploads the executables
# as workflow artifacts.  SDL3 is fetched and built by CMake on every platform.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libgl-dev libegl-dev libdbus-1-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: logo3dprint-linux-x86_64
          path: build/logo3dprint

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: logo3dprint-windows-x86_64
          path: build/Release/logo3dprint.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: logo3dprint-macos-universal
          path: build/logo3dprint
